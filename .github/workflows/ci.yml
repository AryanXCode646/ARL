name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Check code formatting with ruff
        run: |
          ruff format --check src/ tests/

      - name: Lint codebase with ruff
        run: |
          ruff check src/ tests/

      - name: Run static type analysis with mypy
        run: |
          mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run test suite with pytest
        run: |
          pytest -v tests/

  smoke-test:
    name: End-to-End Pipeline Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rl,gui]"

      - name: Verify CLI and environment inspection
        run: |
          adaptive-rl --help
          adaptive-rl version
          adaptive-rl env inspect drone
          adaptive-rl config validate configs/drone_ppo_demo.yaml
          adaptive-rl gui --help

      - name: Run quick training smoke test
        run: |
          adaptive-rl train --config configs/drone_ppo_demo.yaml

      - name: Run evaluation smoke test
        run: |
          adaptive-rl evaluate --config configs/drone_ppo_demo.yaml --model artifacts/models/drone_ppo_demo_final.zip --episodes 5

      - name: Run demo execution
        run: |
          adaptive-rl demo-drone --model artifacts/models/drone_ppo_demo_final.zip --seed 42
