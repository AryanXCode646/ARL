name: "traffic_signal_ppo_baseline"
seed: 42

algorithm:
  name: "ppo"
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  parameters:
    n_steps: 256
    n_epochs: 4
    ent_coef: 0.01
    clip_range: 0.2

environment:
  name: "traffic"
  max_steps: 100
  parameters:
    arrival_rates: [0.35, 0.35, 0.25, 0.25]
    departure_rate: 2
    max_queue: 30
    switch_penalty: 1.0

training:
  total_timesteps: 10000
  checkpoint_freq: 2000
  log_interval: 10

evaluation:
  eval_episodes: 20
  deterministic: true

output_dir: "experiments/results"
log_dir: "experiments/logs"
