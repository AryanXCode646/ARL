name: "drone_curriculum_ppo"
seed: 999

algorithm:
  name: "ppo"
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  parameters:
    n_steps: 512
    clip_range: 0.2
    ent_coef: 0.01

environment:
  name: "drone"
  max_steps: 200
  parameters:
    bounds: [30.0, 30.0, 15.0]
    num_obstacles: 0

curriculum:
  enabled: true
  preset: "drone"
  eval_window: 15

training:
  total_timesteps: 50000
  checkpoint_freq: 10000
  log_interval: 10

evaluation:
  eval_episodes: 20
  deterministic: true

output_dir: "experiments/results"
log_dir: "experiments/logs"
