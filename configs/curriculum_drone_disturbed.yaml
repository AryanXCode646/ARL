name: "drone_disturbed_curriculum"
seed: 42

algorithm:
  name: "ppo"
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  parameters:
    n_steps: 512
    clip_range: 0.2
    ent_coef: 0.01

environment:
  name: "drone_disturbed"
  max_steps: 250
  parameters:
    bounds: [50.0, 50.0, 25.0]
    num_obstacles: 2
    num_dynamic_obstacles: 0
    battery_capacity: 200.0

curriculum:
  enabled: true
  preset: "drone_disturbed"
  eval_window: 15

training:
  total_timesteps: 60000
  checkpoint_freq: 15000
  log_interval: 10

evaluation:
  eval_episodes: 20
  deterministic: true

output_dir: "experiments/results"
log_dir: "experiments/logs"
