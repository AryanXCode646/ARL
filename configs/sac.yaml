name: "pendulum_sac_baseline"
seed: 42

algorithm:
  name: "sac"
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 256
  parameters:
    buffer_size: 100000
    learning_starts: 1000
    tau: 0.005

environment:
  name: "Pendulum-v1"
  max_steps: 200
  parameters: {}

training:
  total_timesteps: 30000
  checkpoint_freq: 5000
  log_interval: 10

evaluation:
  eval_episodes: 20
  deterministic: true

output_dir: "experiments/results"
log_dir: "experiments/logs"
