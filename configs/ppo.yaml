name: "cartpole_ppo_baseline"
seed: 42

algorithm:
  name: "ppo"
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  parameters:
    n_steps: 2048
    ent_coef: 0.0
    clip_range: 0.2

environment:
  name: "CartPole-v1"
  max_steps: 500
  parameters: {}

training:
  total_timesteps: 50000
  checkpoint_freq: 10000
  log_interval: 10

evaluation:
  eval_episodes: 20
  deterministic: true

output_dir: "experiments/results"
log_dir: "experiments/logs"
