# Issue #105: controlled distribution-shift benchmark for drone navigation.
#
# Protocol: the policy is trained ONLY on TRAIN conditions (8 static obstacles,
# low wind) and then evaluated WITHOUT adaptation on TRAIN + TEST-A/B/C/D.
# Train seeds [1000, 1015) and test seeds [2000, 2015) are strictly disjoint;
# the shared test seed block enables paired comparison across TEST scenarios.
#
# Physical parameter scales (DroneDisturbance3DEnv, bounds 50x50x25 m):
# - wind_speed: steady-wind magnitude in m/s (force = linear_damping * wind,
#   linear_damping = 0.05; max_acceleration = 4.0 m/s^2).
#   low = 0.5 m/s -> 0.025 m/s^2 bias; moderate = 4.0 m/s -> 0.2 m/s^2 bias.
# - gust_sigma: OU gust volatility; stationary per-axis std = sigma/sqrt(2*theta).
#   low = 0.15 -> 0.27 m/s per axis; moderate = 0.6 -> 1.10 m/s per axis.
# - disturbance_strength: per-axis stationary std (m/s of equivalent wind) of the
#   hidden injected OU disturbance (excluded from wind observations).
#   high = 6.0 -> ~0.3 m/s^2 per-axis force std, typically unrecoverable drift.
# - disturbance_event_factor = 1.5, recovery_speed_tolerance = 1.0 m/s,
#   recovery_hold_steps = 5 (see RECOVERY_DEFINITION in the JSON artifact).

name: "drone_distribution_shift"
seed: 42

algorithm:
  name: "ppo"
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 128
  parameters:
    n_steps: 1024
    clip_range: 0.2
    ent_coef: 0.01

environment:
  name: "drone_disturbed"
  max_steps: 300
  parameters:
    bounds: [50.0, 50.0, 25.0]
    battery_capacity: 100.0
    dynamic_obstacle_speed: 1.5

training:
  total_timesteps: 60000
  checkpoint_freq: 20000
  log_interval: 10

evaluation:
  eval_episodes: 15
  deterministic: true

output_dir: "experiments/results"
log_dir: "experiments/logs"

benchmark:
  name: "drone_distribution_shift"
  version: "1.0"
  environment_name: "drone_disturbed"
  base_environment_parameters:
    bounds: [50.0, 50.0, 25.0]
    battery_capacity: 100.0
    dynamic_obstacle_speed: 1.5
    disturbance_event_factor: 1.5
    recovery_speed_tolerance: 1.0
    recovery_hold_steps: 5
  evaluation_deterministic: true
  scenarios:
    - name: "TRAIN"
      role: "train"
      description: "8 static obstacles, low wind (0.5 m/s steady, gust sigma 0.15)"
      seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014]
      environment_overrides:
        num_obstacles: 8
        num_dynamic_obstacles: 0
        wind_speed: 0.5
        gust_sigma: 0.15
        disturbance_strength: 0.0
    - name: "TEST-A"
      role: "test"
      description: "10 static obstacles, low wind (obstacle-density shift only)"
      seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014]
      environment_overrides:
        num_obstacles: 10
        num_dynamic_obstacles: 0
        wind_speed: 0.5
        gust_sigma: 0.15
        disturbance_strength: 0.0
    - name: "TEST-B"
      role: "test"
      description: "12 static obstacles, moderate wind (4.0 m/s steady, gust sigma 0.6)"
      seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014]
      environment_overrides:
        num_obstacles: 12
        num_dynamic_obstacles: 0
        wind_speed: 4.0
        gust_sigma: 0.6
        disturbance_strength: 0.0
    - name: "TEST-C"
      role: "test"
      description: "8 static + 4 dynamic obstacles, moderate wind (same total count as TEST-B, 4 moving)"
      seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014]
      environment_overrides:
        num_obstacles: 8
        num_dynamic_obstacles: 4
        wind_speed: 4.0
        gust_sigma: 0.6
        disturbance_strength: 0.0
    - name: "TEST-D"
      role: "test"
      description: "8 static obstacles, low wind, high hidden disturbance (strength 6.0)"
      seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014]
      environment_overrides:
        num_obstacles: 8
        num_dynamic_obstacles: 0
        wind_speed: 0.5
        gust_sigma: 0.15
        disturbance_strength: 6.0
